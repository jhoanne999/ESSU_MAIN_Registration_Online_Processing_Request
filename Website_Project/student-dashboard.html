<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard | ESSU Main Registrar Online Processing System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind (Play CDN). For production, compile Tailwind and replace this script + the config below. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          display: ['Poppins', 'Inter', 'sans-serif']
        },
        colors: {
          ess:  { 950: '#0b1f16', 900: '#0f2a1d', 800: '#16382a', 700: '#1d4a37', 600: '#25604a' },
          gold: { 300: '#f1d488', 400: '#e9c46a', 500: '#d9a92f' }
        }
      }
    }
  };
</script>

<style type="text/tailwindcss">
  @layer components {
    .card  { @apply bg-white border border-slate-200 rounded-2xl shadow-sm; }
    .field {
      @apply w-full rounded-lg bg-white border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900
             placeholder-slate-400 outline-none transition
             focus:border-ess-600 focus:ring-2 focus:ring-ess-600/25
             disabled:bg-slate-50 disabled:text-slate-400 disabled:cursor-not-allowed;
    }
    .btn-gold {
      @apply inline-flex items-center justify-center gap-2 rounded-full px-7 py-3.5 font-display font-semibold text-sm
             text-ess-900 bg-gradient-to-b from-gold-400 to-gold-500 transition
             hover:brightness-105 hover:-translate-y-0.5 active:translate-y-0
             focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ess-600 focus-visible:ring-offset-2
             disabled:opacity-40 disabled:pointer-events-none;
    }
    .btn-ghost {
      @apply inline-flex items-center justify-center gap-2 rounded-full px-7 py-3.5 font-display font-semibold text-sm
             text-ess-800 border border-ess-700 transition hover:bg-ess-700/5
             focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ess-600 focus-visible:ring-offset-2;
    }
  }
</style>

<style>
  .field[readonly] { color: #334155; background: #f8fafc; cursor: default; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .view-in { animation: viewIn .28s ease-out; }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view-in { animation: none; } * { scroll-behavior: auto !important; } }

</style>
</head>

<body class="font-sans text-slate-700 antialiased bg-white">

<a href="#content" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[70] focus:rounded-lg focus:bg-gold-400 focus:px-4 focus:py-2 focus:font-semibold focus:text-ess-900">Skip to main content</a>

<!-- ================= 1. MASTHEAD =================
     Agency logo (max 100px tall) · "Republic of the Philippines" · divider · agency name / region · tagline -->
<header id="masthead" class="bg-ess-900 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-5 sm:px-8 py-5 flex items-center gap-5">
    <!-- Replace with the ESSU logo: <img src="assets/essu-logo.png" alt="Eastern Samar State University logo" style="max-height:100px"> -->
   <div class="shrink-0 w-[72px] h-[72px] sm:w-20 sm:h-20 rounded-full bg-white ring-2 ring-gold-400 grid place-items-center overflow-hidden">
  <img src="./img/logoweb2.png" alt="Eastern Samar State University logo" class="w-full h-full object-contain p-2">
</div>
    <div class="hidden sm:block self-stretch w-px bg-gold-400/50"></div>
    <div class="min-w-0">
      <p class="text-xs sm:text-sm text-white/85">Republic of the Philippines</p>
      <hr class="my-1.5 border-0 h-px bg-gold-400/50">
      <p class="font-display font-bold text-xl sm:text-3xl text-white leading-tight">Eastern Samar State University</p>
      <p class="text-xs sm:text-sm text-gold-300 mt-0.5">Main Campus, Borongan City, Eastern Samar</p>
      <p class="text-xs sm:text-sm text-white/80">Excellence &bull; Accountability &bull; Service</p>
    </div>
  </div>
</header>

<!-- ================= 2. AUXILIARY MENU (optional, max. two levels) + site search ================= -->
<nav id="aux-menu" class="sticky top-0 z-40 bg-ess-800 border-b border-white/10 shadow-sm" aria-label="Registrar portal">
  <div class="max-w-7xl mx-auto px-5 sm:px-8 py-2 min-h-[64px] flex flex-wrap items-center gap-x-4 gap-y-2">
    <ul id="nav" class="flex-1 min-w-0 flex items-center gap-1 sm:gap-2 overflow-x-auto no-scrollbar"></ul>
    <form id="siteSearch" role="search" class="relative order-last sm:order-none flex items-stretch w-full sm:w-56">
      <label for="siteQ" class="sr-only">Search the website</label>
      <input id="siteQ" type="search" autocomplete="off" placeholder="Search" class="w-full rounded-l-full bg-white/10 border border-white/25 pl-4 pr-3 py-2 text-sm text-white placeholder-white/60 outline-none focus:border-gold-400 focus:ring-1 focus:ring-gold-400">
      <button type="submit" class="rounded-r-full bg-gold-400 px-3.5 py-2 text-ess-900 hover:bg-gold-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white" aria-label="Search">
        <i data-icon="search" class="w-4 h-4"></i>
      </button>
      <div id="searchResults" class="hidden absolute left-0 right-0 sm:left-auto sm:right-0 top-full mt-2 sm:w-96 max-h-[70vh] overflow-y-auto rounded-xl bg-white border border-slate-200 shadow-2xl z-50" aria-live="polite"></div>
    </form>
    <a href="#profile" id="navName" class="hidden md:block text-sm font-medium text-white max-w-[160px] truncate rounded-full px-3 py-2 hover:bg-white/10 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold-400" title="Your profile"></a>
    <button id="logout" class="rounded-full border border-white/30 px-4 py-2 text-sm font-medium text-white hover:bg-white/10 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gold-400">Log out</button>
  </div>
</nav>

<!-- ================= 4. BANNER =================
     Not used: the banner is a homepage slideshow. Add it on the landing page only. -->

<!-- ================= 5. CONTENT AREA (plain white, #FFFFFF; 1-3 columns) ================= -->
<main id="content" class="bg-white" style="background-color:#FFFFFF" tabindex="-1">
  <div class="max-w-7xl mx-auto px-5 sm:px-8 pt-10 pb-16 sm:pb-20">
    <div id="view"></div>
  </div>
</main>

<div id="modal-root"></div>
<div id="toasts" class="fixed bottom-5 right-5 z-[60] flex flex-col gap-2 items-end" aria-live="polite"></div>

<script src="student-dashboard.js"></script>
</body>
</html>
