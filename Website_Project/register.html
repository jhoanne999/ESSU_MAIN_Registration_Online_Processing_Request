<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Form</title>
  <link rel="stylesheet" href="./src/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat
bg-green-700">

<header class="fixed top-0 left-0 right-0 z-50 bg-green-950 px-6 py-2">
  <img src="./img/logo2.png" alt="logo" class="w-12 h-12">
</header>


<div class="w-full max-w-xl p-8 rounded-2xl shadow-2xl border border-white/20" style="background:#18392b">

  <form action="register.php" method="POST" id="registerForm">

    <h1 class="text-amber-50 font-bold text-2xl text-center">ESSU Main:</h1>
    <h1 class="text-amber-50 font-bold text-xl text-center">Registrar Online Processing Request</h1>
    <br>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-white mb-2">Student ID</label>
        <input
          type="text"
          id="studentNumber"
          name="studentNumber"   
          placeholder="Student ID"
          style="color: white !important;"
          class="w-full px-4 py-3 border rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>

      <div>
      <label class="block text-white mb-2">Full Name</label>
      <input
          type="text"
          id="fullName"
          placeholder="Full Name"
          style="color: white !important;"
          class="w-full px-4 py-3 border rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>
    </div>
    
    <div class="mb-4">
      <label class="block text-white mb-2">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        style="color: white !important;"
        class="w-full px-4 py-3 border rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-white mb-2">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Password"
          class="w-full px-4 py-3 border rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>

      <div>
        <label class="block text-white mb-2">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm Password"
          class="w-full px-4 py-3 border rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>
    </div>
    <br>
    <p
    id="errorMsg"
    style="color: #ff6b6b; text-align: center; opacity: 0;"
    class="mb-4">
    </p>

    <button
    type="submit"
    id="registerBtn"
    class="w-full py-3 rounded-full bg-white text-gray-800 font-semibold hover:bg-gray-100 transition">Register
    </button>

    <p class="text-center text-gray-600 mt-6">
      Already have an account?
      <a href="index.html" class="text-blue-600 hover:underline">
      Login
      </a>
    </p>
   </form>
</div>
<script src="register.js"></script>
</body>
</html>
