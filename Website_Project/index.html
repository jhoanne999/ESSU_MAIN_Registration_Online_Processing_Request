<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <link rel="stylesheet" href="./src/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #0c2a1e;
      background-image:
        radial-gradient(circle at 18% 20%, rgba(212, 175, 120, 0.10), transparent 40%),
        radial-gradient(circle at 82% 78%, rgba(212, 175, 120, 0.08), transparent 45%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 14px),
        linear-gradient(160deg, #0a2318 0%, #123725 45%, #0c2a1e 100%);
      background-attachment: fixed;
    }
  </style>
</head>


<body class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat">

<header class = "fixed top-0 left-0 right-0 z-50 bg-green-950 px-6 py-2">
  <img src="./img/logo2.png" alt="logo" class="w-12 h-12">
</header>


<div class="w-full max-w-md p-8 rounded-2xl shadow-2xl border border-white/20" style="background:#18392b">
    
    <form action="#" method="POST" id="loginForm">

      <h1 class="text-amber-50 font-bold text-2xl text-center">ESSU Main:</h1>
      <h1 class="text-amber-50 font-bold text-xl text-center">Registrar Online Processing Request</h1>
      <br>
      <div class="mb-4">
        <label class="block text-white mb-2">Student ID/Admin ID</label>
       <input
          type="text"
          id="studentNumber"
          name="studentNumber"
          placeholder="Enter your Student ID/Admin ID"
          style="color: white !important;"
          class="w-full px-4 py-3 border rounded-lg placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>
  
      
      <div class="mb-4">
        <label class="block text-white mb-2">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          class="w-full px-4 py-3 border rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"required>
      </div>
    <br>
<p id="errorMsg" style="color: #ff6b6b; text-align: center; opacity: 0;" class="mb-4"></p>
      
      <button
        type="submit"
        id="loginBtn"
       class="w-full py-3 rounded-full bg-white text-gray-800 font-semibold hover:bg-gray-100 transition">Login
      </button>
      
<p class="text-center text-gray-600 mt-6">
  Don't have an account?
  <a href="register.html" class="text-blue-600 hover:underline">
    Sign Up
  </a>
</p>

    </form>
  </div>
<script src="script.js"></script>
</body>
</html>
