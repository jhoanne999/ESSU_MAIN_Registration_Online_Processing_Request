<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin Dashboard</title>
  <link rel="stylesheet" href="./src/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #0c2a1e;
      background-image:
        radial-gradient(circle at 18% 20%, rgba(212, 175, 120, 0.10), transparent 40%),
        radial-gradient(circle at 82% 78%, rgba(212, 175, 120, 0.08), transparent 45%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 14px),
        linear-gradient(160deg, #0a2318 0%, #123725 45%, #0c2a1e 100%);
      background-attachment: fixed;
    }
  </style>
</head>

<body class="min-h-screen pt-24 pb-10 px-4">

<header class="fixed top-0 left-0 right-0 z-50 bg-green-950 px-6 py-2 flex items-center justify-between">
  <img src="./img/logo2.png" alt="logo" class="w-12 h-12">
  <div class="flex items-center gap-4">
    <span id="welcomeText" class="text-white font-medium"></span>
    <button id="logoutBtn" class="bg-white text-gray-800 px-4 py-2 rounded-full font-semibold hover:bg-gray-100 transition">
      Logout
    </button>
  </div>
</header>

<div class="max-w-4xl mx-auto">

  <div class="p-8 rounded-2xl shadow-2xl border border-white/20 mb-8" style="background:#18392b">
    <h1 class="text-amber-50 font-bold text-2xl mb-6 text-center">Add New Account</h1>

    <form id="addAccountForm">
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-white mb-2">Student/Admin ID</label>
          <input type="text" id="newStudentId" placeholder="ID"
            class="w-full px-4 py-3 border border-white/30 rounded-lg bg-transparent text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div>
          <label class="block text-white mb-2">Full Name</label>
          <input type="text" id="newFullName" placeholder="Full Name"
            class="w-full px-4 py-3 border border-white/30 rounded-lg bg-transparent text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-white mb-2">Email</label>
          <input type="text" id="newEmail" placeholder="Email"
            class="w-full px-4 py-3 border border-white/30 rounded-lg bg-transparent text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-white mb-2">Role</label>
          <select id="newRole"
  style="background-color: transparent !important; background-image: url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='white'><path d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>&quot;); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1rem;"
  class="w-full px-4 py-3 border border-white/30 rounded-lg bg-transparent text-gray-400 appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500">
  <option class="text-black bg-white" value="student">Student</option>
  <option class="text-black bg-white" value="admin">Admin</option>
  <option class="text-black bg-white" value="superadmin">Superadmin</option>
</select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-white mb-2">Password</label>
          <input type="password" id="newPassword" placeholder="Password"
            class="w-full px-4 py-3 border border-white/30 rounded-lg bg-transparent text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div>
          <label class="block text-white mb-2">Confirm Password</label>
          <input type="password" id="newConfirmPassword" placeholder="Confirm Password"
            class="w-full px-4 py-3 border border-white/30 rounded-lg bg-transparent text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
      </div>

      <p id="addErrorMsg" style="color:#ff6b6b; text-align:center; opacity:0;" class="mb-4"></p>
      <p id="addSuccessMsg" style="color:#6bffa0; text-align:center; opacity:0;" class="mb-4"></p>

      <button type="submit" class="w-full py-3 rounded-full bg-white text-gray-800 font-semibold hover:bg-gray-100 transition">
        Add Account
      </button>
    </form>
  </div>

  <div class="p-8 rounded-2xl shadow-2xl border border-white/20" style="background:#18392b">
    <h2 class="text-amber-50 font-bold text-xl mb-4 text-center">Existing Accounts</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-white text-left">
        <thead>
          <tr class="border-b border-white/20">
            <th class="py-2 px-2">ID</th>
            <th class="py-2 px-2">Full Name</th>
            <th class="py-2 px-2">Email</th>
            <th class="py-2 px-2">Role</th>
            <th class="py-2 px-2 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="accountsTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="superadmin-dashboard.js"></script>
</body>
</html>
